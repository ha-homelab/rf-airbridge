<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
  <title id="title">RF Airbridge: ESP8266 NodeMCU v2 and CC1101 wiring</title>
  <desc id="description">Logical connection diagram, not physical header order. NodeMCU D5 GPIO14 connects to CC1101 SCLK, D7 GPIO13 to SI MOSI, D6 GPIO12 to SO MISO, D8 GPIO15 to CSn, and D2 GPIO4 to GDO0 for shared receive and transmit pulse data. A 3.3 volt supply connects to VCC and a common ground connects to GND. GDO2 is unused. The CC1101 uses a 433.92 MHz antenna.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3268c8"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b96717"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .pin { font-family: 'Courier New', monospace; font-size: 20px; fill: #fff; font-weight: bold; }
      .wire-label { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .small { font-size: 17px; }
    </style>
  </defs>

  <rect width="1200" height="940" rx="24" fill="#f5f7fb"/>
  <text x="48" y="49" font-size="15" font-weight="bold" letter-spacing="3" fill="#346465">RF AIRBRIDGE / HARDWARE</text>
  <text x="48" y="100" font-size="38" font-weight="bold" fill="#16253d">ESP8266 + CC1101</text>
  <text x="48" y="134" font-size="20" fill="#52627a">Configured single-pin RF interface · 433.92 MHz ASK/OOK</text>

  <text x="48" y="189" font-size="24" font-weight="bold" fill="#16253d">NodeMCU v2</text>
  <text x="804" y="189" font-size="24" font-weight="bold" fill="#16253d">CC1101</text>
  <text x="973" y="189" font-size="17" fill="#52627a">RF transceiver</text>
  <rect x="48" y="212" width="364" height="542" rx="22" fill="#253750"/>
  <rect x="804" y="212" width="348" height="542" rx="22" fill="#17605c"/>

  <!-- Simplified board silhouettes; neither is a physical pinout drawing. -->
  <g fill="#f5f7fb" stroke="#91a0b5" stroke-width="4">
    <circle cx="69" cy="235" r="6"/><circle cx="69" cy="731" r="6"/>
    <circle cx="1131" cy="235" r="6"/><circle cx="1131" cy="731" r="6"/>
  </g>
  <rect x="82" y="268" width="145" height="274" rx="9" fill="#15283e" stroke="#60728c" stroke-width="2"/>
  <path d="M100 336 V286 H120 V324 H141 V286 H162 V324 H183 V286 H208" fill="none" stroke="#d4b768" stroke-width="5"/>
  <rect x="96" y="356" width="117" height="142" rx="5" fill="#d5dce5" stroke="#93a0b0" stroke-width="2"/>
  <text x="154" y="418" font-size="18" text-anchor="middle" font-weight="bold" fill="#253750">ESP8266</text>
  <text x="154" y="447" font-size="16" text-anchor="middle" fill="#52627a">Wi-Fi MCU</text>
  <text x="154" y="526" font-size="13" text-anchor="middle" fill="#c2cede">ESPHome</text>
  <rect x="110" y="605" width="89" height="40" rx="4" fill="#17253a" stroke="#718099"/>
  <text x="154" y="631" font-size="15" text-anchor="middle" fill="#c2cede">USB–UART</text>
  <rect x="119" y="689" width="72" height="38" rx="5" fill="#d5dce5"/>
  <rect x="128" y="699" width="54" height="17" rx="3" fill="#15283e"/>
  <path d="M154 645 V653 M154 681 V689" stroke="#718099" stroke-width="3"/>
  <text x="154" y="675" font-size="14" text-anchor="middle" fill="#c2cede">USB power</text>

  <rect x="1014" y="333" width="104" height="112" rx="7" fill="#183637" stroke="#80aca5" stroke-width="2"/>
  <g stroke="#a0c2b8" stroke-width="4">
    <path d="M1029 320 V333 M1054 320 V333 M1079 320 V333 M1104 320 V333 M1029 445 V458 M1054 445 V458 M1079 445 V458 M1104 445 V458"/>
    <path d="M1001 350 H1014 M1001 376 H1014 M1001 402 H1014 M1001 428 H1014 M1118 350 H1131 M1118 376 H1131 M1118 402 H1131 M1118 428 H1131"/>
  </g>
  <text x="1066" y="384" font-size="18" text-anchor="middle" font-weight="bold" fill="#fff">CC1101</text>
  <text x="1066" y="411" font-size="15" text-anchor="middle" fill="#bad9d2">RX / TX</text>
  <path d="M1066 320 V272 H1087 V242" fill="none" stroke="#a8c1a2" stroke-width="3"/>
  <circle cx="1087" cy="235" r="9" fill="#d4b768"/>
  <path d="M1087 225 V221" stroke="#d4b768" stroke-width="4"/>
  <text x="978" y="285" font-size="16" fill="#d8eae4">Antenna</text>
  <path d="M1054 279 H1087 V251" fill="none" stroke="#d8eae4" stroke-width="2"/>
  <text x="998" y="496" font-size="15" fill="#d8eae4">433.92 MHz</text>
  <text x="1040" y="582" font-size="15" fill="#d8eae4">GDO2</text>
  <text x="1019" y="605" font-size="14" fill="#d8eae4">not connected</text>

  <!-- Pin rows are arranged for clarity, not to reproduce a module header. -->
  <g class="pin" text-anchor="end">
    <text x="391" y="307">D5 · GPIO14</text>
    <text x="391" y="365">D7 · GPIO13</text>
    <text x="391" y="423">D6 · GPIO12</text>
    <text x="391" y="481">D8 · GPIO15</text>
    <text x="391" y="553">D2 · GPIO4</text>
    <text x="391" y="637">3V3</text>
    <text x="391" y="695">GND</text>
  </g>
  <g class="pin">
    <text x="826" y="307">SCLK</text>
    <text x="826" y="365">SI / MOSI</text>
    <text x="826" y="423">SO / MISO</text>
    <text x="826" y="481">CSn</text>
    <text x="826" y="553">GDO0</text>
    <text x="826" y="637">VCC</text>
    <text x="826" y="695">GND</text>
  </g>

  <g stroke="#3268c8" stroke-width="4" fill="none">
    <path d="M412 300 H788" marker-end="url(#blue-arrow)"/>
    <path d="M412 358 H788" marker-end="url(#blue-arrow)"/>
    <path d="M804 416 H428" marker-end="url(#blue-arrow)"/>
    <path d="M412 474 H788" marker-end="url(#blue-arrow)"/>
  </g>
  <g fill="#3268c8">
    <circle cx="412" cy="300" r="6"/><circle cx="804" cy="300" r="6"/>
    <circle cx="412" cy="358" r="6"/><circle cx="804" cy="358" r="6"/>
    <circle cx="412" cy="416" r="6"/><circle cx="804" cy="416" r="6"/>
    <circle cx="412" cy="474" r="6"/><circle cx="804" cy="474" r="6"/>
  </g>
  <g class="wire-label" fill="#3268c8">
    <text x="608" y="283">SPI clock</text>
    <text x="608" y="341">SPI data to radio</text>
    <text x="608" y="399">SPI data to ESP8266</text>
    <text x="608" y="457">Chip select · active low</text>
  </g>

  <rect x="457" y="513" width="302" height="27" rx="8" fill="#fff0dc"/>
  <text x="608" y="532" class="wire-label" fill="#98520b">Shared RX / TX pulse data</text>
  <path d="M429 546 H787" stroke="#b96717" stroke-width="4" fill="none" marker-start="url(#orange-arrow)" marker-end="url(#orange-arrow)"/>
  <g fill="#b96717"><circle cx="412" cy="546" r="6"/><circle cx="804" cy="546" r="6"/></g>
  <text x="608" y="575" font-size="16" text-anchor="middle" fill="#78552c">Half duplex: receive or transmit</text>
  <path d="M412 630 H804" stroke="#bd4157" stroke-width="4"/>
  <g fill="#bd4157"><circle cx="412" cy="630" r="6"/><circle cx="804" cy="630" r="6"/></g>
  <text x="608" y="613" class="wire-label" fill="#a33146">3.3 V supply</text>
  <path d="M412 688 H804" stroke="#617087" stroke-width="4"/>
  <g fill="#617087"><circle cx="412" cy="688" r="6"/><circle cx="804" cy="688" r="6"/></g>
  <text x="608" y="671" class="wire-label" fill="#52627a">Common ground</text>

  <rect x="48" y="784" width="1104" height="100" rx="16" fill="#e7edf5"/>
  <text x="72" y="817" font-size="20" font-weight="bold" fill="#253750">3.3 V power and logic</text>
  <text x="72" y="846" class="small" fill="#52627a">Use the NodeMCU 3V3 rail for the CC1101 module shown here.</text>
  <text x="72" y="870" class="small" fill="#52627a">Do not connect CC1101 VCC or its signal pins to the USB 5 V rail.</text>
  <text x="48" y="919" font-size="17" fill="#52627a">Logical wiring, not physical header order. Check the labels on your exact module before connecting.</text>
</svg>
