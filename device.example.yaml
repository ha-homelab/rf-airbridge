# Copy to device.yaml in this repository root; keep your actual file private.
substitutions:
  rf_airbridge_path: .
  rf_source: rf

esphome:
  name: rf
  friendly_name: RF

esp8266:
  board: nodemcuv2
  restore_from_flash: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

packages:
  rf_airbridge: !include packages/rf-airbridge.yaml

# Retain your existing binary_sensor definitions here when migrating.
