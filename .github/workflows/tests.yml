name: Validation

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/change-scope.yml@42c1200e7ec4ce7ed32fa1c9e7492449b1f04b80 # main
    with:
      force-full: false
      documentation-paths: "[\"GOVERNANCE.md\", \"ROADMAP.md\"]"
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-capture.txt
      - name: Check native test compiler
        run: c++ --version
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt -r requirements-capture.txt
      - name: Run host tests with native memory-safety checks
        env:
          RF_CPP_SANITIZERS: '1'
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m unittest discover -s tests -v
      - name: Fuzz native RF parsing and request validation
        env:
          CXX: clang++
        run: bash fuzz/run.sh 15
      - name: Test documentation-scope gate contracts
        run: python3 .github/workflow-tests/test_docs_scope.py
  firmware:
    needs: ["scope"]
    if: ${{ always() }}
    name: Compile ESPHome example
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Require successful change classification
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = ['scope']
          if set(results) != set(expected):
              raise SystemExit('Validation job inventory differs')
          scope = results['scope']
          outputs = scope.get('outputs', {})
          run = outputs.get('run')
          if scope['result'] != 'success' or run not in {'true', 'false'}:
              raise SystemExit('Change scope did not succeed')
          if run == 'false' and outputs.get('reason') != 'documentation-only':
              raise SystemExit('Unproven documentation-only scope')
          for name, value in results.items():
              wanted = 'success' if run == 'true' or name == 'scope' else 'skipped'
              if value['result'] != wanted:
                  raise SystemExit(f'Unexpected validation result: {name}={value["result"]}, expected {wanted}')
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile example with dummy credentials
        if: ${{ needs.scope.outputs.run == 'true' }}
        # Start the container after host-level monitoring is active.
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --entrypoint python \
            ghcr.io/esphome/esphome:2026.8.2 \
            tools/validate_firmware.py --with-wake-on-lan --with-lg2-wake-on-lan
